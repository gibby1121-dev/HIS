name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest -v
      - name: Pipeline smoke run on sample data
        run: |
          python3 market_snapshot.py
          test -s notebooklm_source.md
      - name: Meta pilot smoke run on sample data
        run: |
          python3 meta_pilot.py report --inventory sample/meta_pilot/inventory_sample.csv \
            --pilot sample/meta_pilot/pilot_units_sample.csv \
            --ads sample/meta_pilot/ads_export_sample.csv \
            --as-of 2026-10-05 --out gavel_reports
          test -s gavel_reports/SN2001.html
